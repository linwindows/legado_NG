name: Fork APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew assembleAppDebug --build-cache --parallel --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: legado-ng-debug-${{ github.run_number }}
          path: app/build/outputs/apk/app/debug/*.apk
          if-no-files-found: error
          retention-days: 14
